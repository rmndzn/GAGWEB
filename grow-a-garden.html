<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow a Garden</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .stat-item .icon {
            font-size: 28px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        .garden-section {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .garden-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .plot {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #8B4513 0%, #654321 100%);
            border: 3px solid #5C4033;
            border-radius: 15px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .plot:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .plot.empty::before {
            content: '🌱';
            font-size: 35px;
            opacity: 0.3;
        }

        .timer-display {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: white;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            z-index: 3;
            font-family: 'Fredoka', sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .timer-display.ready {
            background: rgba(76, 175, 80, 0.9);
            animation: pulseReady 1s infinite;
        }

        @keyframes pulseReady {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
        }

        .mutation-badge {
            position: absolute;
            top: 5px;
            left: 5px;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            z-index: 2;
            background: rgba(0, 0, 0, 0.7);
        }

        .plant.glow {
            animation: glowPulse 2s infinite;
        }

        @keyframes glowPulse {
            0%, 100% { filter: drop-shadow(0 0 10px yellow); }
            50% { filter: drop-shadow(0 0 20px yellow); }
        }

        .plant.sparkle {
            animation: sparkleSpin 3s linear infinite;
        }

        @keyframes sparkleSpin {
            0% { filter: drop-shadow(0 0 10px cyan) hue-rotate(0deg); }
            100% { filter: drop-shadow(0 0 10px cyan) hue-rotate(360deg); }
        }

        .plant.frost {
            filter: drop-shadow(0 0 15px lightblue) brightness(1.3);
        }

        .plant.golden {
            animation: goldenShine 2s infinite;
        }

        @keyframes goldenShine {
            0%, 100% { filter: drop-shadow(0 0 15px gold) brightness(1.2); }
            50% { filter: drop-shadow(0 0 25px gold) brightness(1.5); }
        }

        .plant.dark {
            filter: drop-shadow(0 0 20px purple) brightness(0.8) contrast(1.5);
        }

        .plant.crystal {
            animation: crystalShimmer 2s infinite;
        }

        @keyframes crystalShimmer {
            0%, 100% { filter: drop-shadow(0 0 20px white) brightness(1.5); }
            50% { filter: drop-shadow(0 0 30px cyan) brightness(1.8); }
        }

        .plant.ethereal {
            animation: etherealFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.8)) brightness(1.4);
        }

        @keyframes etherealFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .plant.celestial-mut {
            animation: celestialRotate 4s linear infinite, celestialGlow 2s infinite;
        }

        @keyframes celestialRotate {
            0% { filter: hue-rotate(0deg) drop-shadow(0 0 30px white); }
            100% { filter: hue-rotate(360deg) drop-shadow(0 0 30px white); }
        }

        @keyframes celestialGlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .seed-inventory-item {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: grab;
            transition: all 0.3s;
            position: relative;
        }

        .seed-inventory-item:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .seed-inventory-item:active {
            cursor: grabbing;
        }

        .seed-inventory-item.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .seed-inventory-item .seed-icon {
            font-size: 40px;
            margin-bottom: 5px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .seed-inventory-item .seed-name {
            font-size: 12px;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 3px;
        }

        .seed-inventory-item .seed-count {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: white;
            border-radius: 12px;
            padding: 3px 8px;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .plot.drag-over {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            border-color: #4CAF50;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.6);
        }

        .plot.drag-over::before {
            content: '⬇️';
            font-size: 40px;
            opacity: 0.8;
        }

        .seeds-inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .plant {
            font-size: 50px;
            transition: all 0.3s;
            animation: growIn 0.5s ease-out;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        @keyframes growIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .plant.stage-1 {
            font-size: 25px;
        }

        .plant.stage-2 {
            font-size: 35px;
        }

        .plant.stage-3 {
            font-size: 50px;
        }

        .rarity-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .prismatic {
            animation: rainbow 3s linear infinite;
        }

        .prismatic .rarity-glow {
            background: linear-gradient(45deg, red, orange, yellow, green, cyan, blue, violet);
            animation: pulse 2s infinite, rainbow 3s linear infinite;
        }

        .rarity-badge {
            position: absolute;
            top: 5px;
            right: 5px;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            margin-bottom: 20px;
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 12px;
        }

        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin: 12px 0;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .shop-item:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .shop-item.out-of-stock {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .shop-item-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        .shop-item-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .shop-item-header .seed-icon {
            font-size: 32px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .shop-item-title {
            font-weight: 700;
            font-size: 16px;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            font-family: 'Fredoka', sans-serif;
        }

        .shop-item-description {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.9);
            margin-left: 44px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .stock-display {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            font-family: 'Fredoka', sans-serif;
        }

        .stock-display.low {
            background: rgba(255, 152, 0, 0.8);
        }

        .stock-display.out {
            background: rgba(244, 67, 54, 0.8);
        }

        .buy-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .buy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .buy-btn:disabled {
            background: rgba(150, 150, 150, 0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .inventory-item {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            position: relative;
            transition: all 0.3s;
        }

        .inventory-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .inventory-item .plant-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .inventory-item .count {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: white;
            border-radius: 12px;
            padding: 3px 8px;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .inventory-item .rarity-name {
            color: white;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 8px;
        }

        .sell-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Fredoka', sans-serif;
            margin-top: 5px;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .sell-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
            font-weight: bold;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .garden-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 768px) {
            .garden-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .title {
            text-align: center;
            color: white;
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 15px;
            font-family: 'Fredoka', sans-serif;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">🌻 Grow a Garden 🌻</div>
            <div class="stats">
                <div class="stat-item">
                    <span class="icon">💰</span>
                    <span id="money">500</span> Coins
                </div>
                <div class="stat-item">
                    <span class="icon">🏆</span>
                    <span id="totalHarvested">0</span> Harvested
                </div>
                <div class="stat-item" id="weatherDisplay">
                    <span class="icon">☀️</span>
                    <span>Sunny</span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="garden-section">
                <h2 style="color: white; margin-bottom: 15px; font-family: 'Fredoka', sans-serif; font-size: 24px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);">🏡 Your Garden</h2>
                <div class="garden-grid" id="gardenGrid"></div>
            </div>

            <div class="sidebar">
                <div class="panel">
                    <h2>🌱 Seeds Inventory</h2>
                    <div class="seeds-inventory-grid" id="seedsInventoryGrid"></div>
                </div>

                <div class="panel">
                    <h2>🏪 Seed Shop</h2>
                    <div id="shopContainer"></div>
                    <div style="margin-top: 15px; padding: 12px; background: rgba(0, 0, 0, 0.3); border-radius: 12px; text-align: center; color: white; font-size: 13px; font-weight: 600;">
                        🔄 Stock refreshes in: <span id="stockTimer">5:00</span>
                    </div>
                </div>

                <div class="panel">
                    <h2>📦 Harvested Plants</h2>
                    <div class="inventory-grid" id="inventoryGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Plant Types (Common to Prismatic)
        const plantTypes = [
            { 
                name: 'Carrot', 
                rarity: 'Common', 
                color: '#999999', 
                emoji: '🥕', 
                baseValue: 5, 
                price: 50,

            {

            {

            {

                baseValue: 10000, 
                price: 25000, 
                growthTime: 15000,
                baseWeight: { min: 3.0, max: 10.0 }
            }
        ];

        // Weather System
        const weatherTypes = [
            { name: 'Sunny', emoji: '☀️', mutationChance: 0.05, color: '#FFD700' },
            { name: 'Rainy', emoji: '🌧️', mutationChance: 0.15, color: '#4682B4' },
            { name: 'Cloudy', emoji: '☁️', mutationChance: 0.08, color: '#B0C4DE' },
            { name: 'Stormy', emoji: '⛈️', mutationChance: 0.20, color: '#483D8B' },
            { name: 'Lunar', emoji: '🌙', mutationChance: 0.25, color: '#191970' },
            { name: 'Misty', emoji: '🌫️', mutationChance: 0.12, color: '#778899' }
        ];

        // Mutation Types
        const mutationTypes = [
            { name: 'Glowing', emoji: '✨', prefix: 'Glowing', multiplier: 1.5, visual: 'glow' },
            { name: 'Sparkling', emoji: '💫', prefix: 'Sparkling', multiplier: 1.8, visual: 'sparkle' },
            { name: 'Frosty', emoji: '❄️', prefix: 'Frosty', multiplier: 2.0, visual: 'frost' },
            { name: 'Golden', emoji: '⭐', prefix: 'Golden', multiplier: 2.5, visual: 'golden' },
            { name: 'Dark', emoji: '🌑', prefix: 'Dark', multiplier: 2.2, visual: 'dark' },
            { name: 'Crystal', emoji: '💎', prefix: 'Crystal', multiplier: 3.0, visual: 'crystal' },
            { name: 'Ethereal', emoji: '👻', prefix: 'Ethereal', multiplier: 3.5, visual: 'ethereal' },
            { name: 'Celestial', emoji: '🌟', prefix: 'Celestial', multiplier: 4.0, visual: 'celestial-mut' }
        ];

        // Game State
        const gameState = {
            money: 500,
            seeds: {},
            totalHarvested: 0,
            garden: [],
            inventory: {},
            shopStock: {},
            lastStockRefresh: Date.now(),
            currentWeather: weatherTypes[0],
            lastWeatherChange: Date.now()
        };

        // Initialize seeds inventory
        plantTypes.forEach(plant => {
            gameState.seeds[plant.name] = plant.name === 'Carrot' ? 3 : 0;
        });

        // Initialize Garden
        function initGarden() {
            const grid = document.getElementById('gardenGrid');
            for (let i = 0; i < 25; i++) {
                const plot = document.createElement('div');
                plot.className = 'plot empty';
                plot.dataset.index = i;
                
                // Add click functionality (for harvesting)
                plot.onclick = () => {
                    if (gameState.garden[i] !== null) {
                        harvestPlant(i);
                    }
                };
                
                // Add drag and drop functionality
                plot.addEventListener('dragover', handleDragOver);
                plot.addEventListener('dragleave', handleDragLeave);
                plot.addEventListener('drop', handleDrop);
                
                grid.appendChild(plot);
                gameState.garden.push(null);
            }
            updateUI();
        }

        // Drag and Drop Handlers
        let draggedSeedType = null;

        function handleDragStart(e, plantName) {
            draggedSeedType = plantName;
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            draggedSeedType = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            
            const index = parseInt(e.currentTarget.dataset.index);
            if (gameState.garden[index] === null) {
                e.currentTarget.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            
            const index = parseInt(e.currentTarget.dataset.index);
            
            if (draggedSeedType && gameState.garden[index] === null) {
                plantSeedByName(index, draggedSeedType);
            }
        }

        // Plant Seed (by name for drag and drop)
        function plantSeedByName(index, plantName) {
            if (gameState.garden[index] !== null) {
                return;
            }

            if (gameState.seeds[plantName] <= 0) {
                showNotification('❌ No seeds left!');
                return;
            }

            const selectedPlant = plantTypes.find(p => p.name === plantName);
            if (!selectedPlant) return;

            gameState.seeds[plantName]--;
            
            // Check for mutation
            let mutation = null;
            if (Math.random() < gameState.currentWeather.mutationChance) {
                mutation = mutationTypes[Math.floor(Math.random() * mutationTypes.length)];
                showNotification(`✨ ${mutation.prefix} mutation occurred!`);
            }

            const plant = {
                plantType: selectedPlant,
                stage: 1,
                plantedAt: Date.now(),
                harvestTime: Date.now() + selectedPlant.growthTime,
                mutation: mutation
            };

            gameState.garden[index] = plant;
            
            // Start growth
            growPlant(index);
            
            updateUI();
            renderGarden();
            renderSeedsInventory();
        }

        // Grow Plant
        function growPlant(index) {
            const plant = gameState.garden[index];
            if (!plant) return;

            const growTime = plant.plantType.growthTime / 3; // Divide by 3 stages
            
            const growInterval = setInterval(() => {
                if (!gameState.garden[index] || gameState.garden[index].stage >= 3) {
                    clearInterval(growInterval);
                    return;
                }

                gameState.garden[index].stage++;
                renderGarden();
            }, growTime);
        }

        // Initialize Shop Stock
        function initializeShopStock() {
            plantTypes.forEach(plant => {
                // Stock based on rarity - higher rarity = lower stock
                const baseStock = plant.name === 'Carrot' ? 999 : 
                                  plantTypes.indexOf(plant) < 3 ? 30 :
                                  plantTypes.indexOf(plant) < 6 ? 15 : 5;
                gameState.shopStock[plant.name] = Math.floor(Math.random() * baseStock) + Math.floor(baseStock / 2);
            });
            renderShop();
        }

        // Refresh Shop Stock
        function refreshShopStock() {
            plantTypes.forEach(plant => {
                if (plant.name !== 'Carrot') {
                    const baseStock = plantTypes.indexOf(plant) < 3 ? 30 :
                                      plantTypes.indexOf(plant) < 6 ? 15 : 5;
                    gameState.shopStock[plant.name] = Math.floor(Math.random() * baseStock) + Math.floor(baseStock / 2);
                }
            });
            gameState.lastStockRefresh = Date.now();
            showNotification('🔄 Shop stock refreshed!');
            renderShop();
        }

        // Update Stock Timer
        function updateStockTimer() {
            const elapsed = Date.now() - gameState.lastStockRefresh;
            const remaining = (5 * 60 * 1000) - elapsed; // 5 minutes in ms
            
            if (remaining <= 0) {
                refreshShopStock();
                return;
            }
            
            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
            
            const timerEl = document.getElementById('stockTimer');
            if (timerEl) {
                timerEl.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }
        }

        // Render Shop
        function renderShop() {
            const container = document.getElementById('shopContainer');
            container.innerHTML = '';

            plantTypes.forEach(plant => {
                const stock = gameState.shopStock[plant.name];
                const outOfStock = stock === 0;
                
                const item = document.createElement('div');
                item.className = `shop-item ${outOfStock ? 'out-of-stock' : ''}`;
                if (!outOfStock) {
                    item.onclick = () => buySeed(plant.name);
                }
                
                const maxStock = plant.name === 'Carrot' ? 999 : 
                                 plantTypes.indexOf(plant) < 3 ? 30 :
                                 plantTypes.indexOf(plant) < 6 ? 15 : 5;
                
                let stockClass = '';
                if (stock === 0) stockClass = 'out';
                else if (stock <= maxStock * 0.3) stockClass = 'low';
                
                item.innerHTML = `
                    ${plant.name !== 'Carrot' ? `<div class="stock-display ${stockClass}">Stock: ${stock}</div>` : ''}
                    <div class="shop-item-info">
                        <div class="shop-item-header">
                            <span class="seed-icon">${plant.emoji}</span>
                            <span class="shop-item-title">${plant.name} Seed</span>
                        </div>
                        <div class="shop-item-description" style="color: ${plant.color === 'rainbow' ? 'white' : plant.color}">${plant.rarity} • ${(plant.growthTime/1000).toFixed(0)}s growth</div>
                    </div>
                    <button class="buy-btn" ${outOfStock ? 'disabled' : ''}>${plant.price} 💰</button>
                `;
                
                container.appendChild(item);
            });
        }

        // Buy Seed
        function buySeed(plantName) {
            const plant = plantTypes.find(p => p.name === plantName);
            const stock = gameState.shopStock[plantName];
            
            if (stock === 0) {
                showNotification('❌ Out of stock!');
                return;
            }
            
            if (gameState.money < plant.price) {
                showNotification('❌ Not enough money!');
                return;
            }

            gameState.money -= plant.price;
            gameState.seeds[plantName]++;
            if (plant.name !== 'Carrot') {
                gameState.shopStock[plantName]--;
            }
            
            showNotification(`${plant.emoji} Bought ${plant.name} Seed!`);
            updateUI();
            renderShop();
            renderSeedsInventory();
        }

        // Harvest Plant
        function harvestPlant(index) {
            const plant = gameState.garden[index];
            if (!plant || plant.stage < 3) {
                showNotification('⏰ Plant not ready yet!');
                return;
            }

            const plantType = plant.plantType;
            const mutation = plant.mutation;
            
            // Calculate weight
            const weight = (Math.random() * (plantType.baseWeight.max - plantType.baseWeight.min) + plantType.baseWeight.min).toFixed(2);
            
            // Calculate value: baseValue * weight * mutationMultiplier
            const mutationMultiplier = mutation ? mutation.multiplier : 1;
            const value = Math.floor(plantType.baseValue * parseFloat(weight) * mutationMultiplier);

            // Create inventory key
            const inventoryKey = mutation ? `${mutation.prefix} ${plantType.name}` : plantType.name;
            
            // Add to inventory
            if (!gameState.inventory[inventoryKey]) {
                gameState.inventory[inventoryKey] = {
                    plantType: plantType,
                    mutation: mutation,
                    harvests: []
                };
            }
            gameState.inventory[inventoryKey].harvests.push({
                weight: parseFloat(weight),
                value: value
            });

            gameState.money += value;
            gameState.totalHarvested++;
            gameState.garden[index] = null;

            const mutationText = mutation ? `${mutation.emoji} ${mutation.prefix} ` : '';
            showNotification(`✨ Harvested ${mutationText}${plantType.emoji} ${plantType.name} (${weight}kg) +${value} 💰`);
            
            updateUI();
            renderGarden();
        }

        // Render Seeds Inventory
        function renderSeedsInventory() {
            const grid = document.getElementById('seedsInventoryGrid');
            grid.innerHTML = '';

            Object.entries(gameState.seeds).forEach(([plantName, count]) => {
                if (count <= 0) return;

                const plantType = plantTypes.find(p => p.name === plantName);
                if (!plantType) return;
                
                const item = document.createElement('div');
                item.className = 'seed-inventory-item';
                item.draggable = true;
                
                // Add drag event listeners
                item.addEventListener('dragstart', (e) => handleDragStart(e, plantName));
                item.addEventListener('dragend', handleDragEnd);
                
                const color = plantType.color === 'rainbow' ? 'white' : plantType.color;
                
                item.innerHTML = `
                    <div class="seed-icon">${plantType.emoji}</div>
                    <div class="seed-name">${plantName} Seed</div>
                    <div class="seed-count">${count}</div>
                `;
                
                grid.appendChild(item);
            });
        }

        // Render Garden
        function renderGarden() {
            const grid = document.getElementById('gardenGrid');
            const plots = grid.children;

            gameState.garden.forEach((plant, index) => {
                const plot = plots[index];
                plot.innerHTML = '';

                if (plant) {
                    plot.className = 'plot';
                    
                    const plantType = plant.plantType;
                    const mutation = plant.mutation;
                    
                    // Add rarity glow
                    const glow = document.createElement('div');
                    glow.className = 'rarity-glow';
                    if (plantType.rarity === 'Prismatic') {
                        plot.classList.add('prismatic');
                        glow.style.background = 'linear-gradient(45deg, red, orange, yellow, green, cyan, blue, violet)';
                    } else {
                        glow.style.background = plantType.color;
                    }
                    plot.appendChild(glow);

                    // Add plant with mutation effect
                    const plantEl = document.createElement('div');
                    let plantClass = `plant stage-${plant.stage}`;
                    if (mutation) {
                        plantClass += ` ${mutation.visual}`;
                    }
                    plantEl.className = plantClass;
                    plantEl.textContent = plantType.emoji;
                    plot.appendChild(plantEl);

                    // Add mutation badge
                    if (mutation) {
                        const mutBadge = document.createElement('div');
                        mutBadge.className = 'mutation-badge';
                        mutBadge.textContent = `${mutation.emoji} ${mutation.name}`;
                        plot.appendChild(mutBadge);
                    }

                    // Add rarity badge
                    const badge = document.createElement('div');
                    badge.className = 'rarity-badge';
                    badge.textContent = plantType.rarity;
                    badge.style.background = plantType.rarity === 'Prismatic' ? 
                        'linear-gradient(45deg, red, orange, yellow, green, cyan, blue, violet)' : 
                        plantType.color;
                    plot.appendChild(badge);

                    // Add timer
                    const timer = document.createElement('div');
                    const now = Date.now();
                    const remaining = plant.harvestTime - now;
                    
                    if (plant.stage >= 3) {
                        timer.className = 'timer-display ready';
                        timer.textContent = '✅ Ready!';
                    } else if (remaining > 0) {
                        timer.className = 'timer-display';
                        const seconds = Math.ceil(remaining / 1000);
                        timer.textContent = `⏱️ ${seconds}s`;
                    }
                    plot.appendChild(timer);
                } else {
                    plot.className = 'plot empty';
                }
            });

            renderInventory();
            renderSeedsInventory();
        }

        // Render Inventory
        function renderInventory() {
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = '';

            Object.entries(gameState.inventory).forEach(([key, data]) => {
                if (data.harvests.length === 0) return;

                const plantType = data.plantType;
                const mutation = data.mutation;
                const totalWeight = data.harvests.reduce((sum, h) => sum + h.weight, 0).toFixed(2);
                const totalValue = data.harvests.reduce((sum, h) => sum + h.value, 0);
                const avgValue = Math.floor(totalValue / data.harvests.length);
                
                const item = document.createElement('div');
                item.className = 'inventory-item';
                
                const color = plantType.color === 'rainbow' ? 'white' : plantType.color;
                const mutationEmoji = mutation ? mutation.emoji : '';
                
                item.innerHTML = `
                    <div class="plant-icon" style="filter: drop-shadow(0 0 5px ${plantType.color})">${mutationEmoji}${plantType.emoji}</div>
                    <div class="rarity-name" style="font-size: 11px; color: ${color}">${key}</div>
                    <div style="font-size: 10px; color: rgba(255,255,255,0.9); margin: 3px 0;">
                        ${totalWeight}kg (${data.harvests.length}x)
                    </div>
                    <div class="count">${data.harvests.length}</div>
                    <button class="sell-btn" onclick="sellPlant('${key}')">Sell ${avgValue} 💰</button>
                `;
                
                grid.appendChild(item);
            });
        }

        // Sell Plant
        function sellPlant(key) {
            const data = gameState.inventory[key];
            if (!data || data.harvests.length === 0) return;

            // Sell one harvest (the oldest one)
            const harvest = data.harvests.shift();
            gameState.money += harvest.value;

            showNotification(`💰 Sold ${key} (${harvest.weight}kg) for ${harvest.value} coins!`);
            
            // Clean up if no harvests left
            if (data.harvests.length === 0) {
                delete gameState.inventory[key];
            }
            
            updateUI();
            renderInventory();
        }

        // Update UI
        function updateUI() {
            document.getElementById('money').textContent = gameState.money;
            document.getElementById('totalHarvested').textContent = gameState.totalHarvested;
            
            // Update weather display
            const weatherDisplay = document.getElementById('weatherDisplay');
            weatherDisplay.innerHTML = `
                <span class="icon">${gameState.currentWeather.emoji}</span>
                <span style="color: ${gameState.currentWeather.color}">${gameState.currentWeather.name}</span>
            `;
        }

        // Change Weather
        function changeWeather() {
            const newWeather = weatherTypes[Math.floor(Math.random() * weatherTypes.length)];
            gameState.currentWeather = newWeather;
            gameState.lastWeatherChange = Date.now();
            showNotification(`${newWeather.emoji} Weather changed to ${newWeather.name}!`);
            updateUI();
        }

        // Show Notification
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Initialize Game
        initGarden();
        initializeShopStock();
        updateUI();
        renderSeedsInventory();
        
        // Update timers every second
        setInterval(() => {
            renderGarden();
            updateStockTimer();
        }, 1000);
        
        // Change weather every 2 minutes
        setInterval(() => {
            changeWeather();
        }, 120000); // 2 minutes
    </script>
</body>
</html>
